<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kehys</title>
<meta name="description" content="Reunukset ja artkehykset valmiisiin kuviin. Kuvat käsitellään laitteella.">
<meta name="theme-color" content="#1b1a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kehys">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* Pimiö: tumma työpöytä, kuva keskellä, säätimet oikealla (pystyssä alla). Yksi tumma teema tarkoituksella. */
:root {
  color-scheme: dark;
  --bg: #1b1a19;          /* työpöytä */
  --panel: #242321;       /* paneeli */
  --well: #2e2c29;        /* kentät */
  --line: #3b3935;
  --fg: #e6e2da;
  --muted: #9a958b;
  --accent: #d4892f;      /* pimiövalon meripihka */
  --accent-ink: #1b1a19;
  --warn: #e0a040;
  --ok: #7fae6e;
  --f-ui: -apple-system, system-ui, "Helvetica Neue", sans-serif;
  --f-head: -apple-system, system-ui, "Helvetica Neue", sans-serif;
  --f-num: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-ui); overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.brand { font: 600 18px var(--f-head); letter-spacing: .02em; margin-right: auto; }
.brand small { font: 400 12px var(--f-ui); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.btn { background: var(--well); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; min-height: 36px; }
.btn:hover { border-color: #57534c; }
.btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.view { position: relative; display: grid; place-items: center; min-height: 0; padding: 16px; }
.view canvas { max-width: 100%; max-height: 100%; box-shadow: 0 6px 30px rgba(0,0,0,.45); background: #000; }
.busy { position: absolute; top: 12px; right: 16px; font: 12px var(--f-num); color: var(--muted); }
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 12px; border-top: 1px solid var(--line); min-height: 92px; align-items: center; }
.thumb { position: relative; flex: 0 0 auto; width: 72px; height: 72px; border-radius: 4px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: var(--well); padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.on { border-color: var(--accent); }
.thumb .x { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; line-height: 22px; cursor: pointer; }
.strip .empty { color: var(--muted); font-size: 13px; }
.info { font: 12px var(--f-num); color: var(--muted); padding: 0 16px 8px; }

.side { min-width: 0; overflow: hidden; background: var(--panel); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.presets { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.presets select { width: 100%; }
.state { font-size: 12px; color: var(--muted); }
.state.dirty { color: var(--warn); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.row-btns .btn { flex: 1 1 auto; padding: 6px 8px; font-size: 14px; }
.inline { display: flex; gap: 6px; }
.inline input { flex: 1; min-width: 0; }
.form { overflow-y: auto; padding: 8px 10px 16px; -webkit-overflow-scrolling: touch; }
details.sec { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; background: #262522; }
details.sec > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; font: 600 15px var(--f-head); letter-spacing: .02em; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: "▸"; color: var(--muted); width: 10px; transition: transform .15s; }
details.sec[open] > summary::before { transform: rotate(90deg); }
summary .tog { margin-left: auto; display: flex; gap: 6px; align-items: center; font: 400 13px var(--f-ui); color: var(--muted); }
.body { padding: 2px 10px 10px; display: grid; gap: 8px; }
.body.off { opacity: .4; }
.f { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 8px; align-items: center; }
.f > label { font-size: 13px; line-height: 1.2; color: var(--muted); text-align: right; }
.f .ctl { display: flex; gap: 8px; align-items: center; min-width: 0; }
.f input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.f input[type=number] { width: 64px; font: 13px var(--f-num); }
.f select { flex: 1; min-width: 0; }
input[type=number], input[type=text], select { background: var(--well); border: 1px solid var(--line); border-radius: 5px; padding: 6px 7px; }
input[type=color] { width: 64px; height: 30px; border: 1px solid var(--line); border-radius: 5px; background: var(--well); padding: 2px; }
.sub { font: 600 13px var(--f-head); color: var(--fg); letter-spacing: .04em; text-transform: uppercase; padding-top: 6px; }
.hint { font-size: 12px; color: var(--muted); }
.unit { width: 18px; flex: 0 0 18px; }
.save { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
.save .row-btns .btn { font-size: 15px; }
.msg { font-size: 13px; color: var(--muted); min-height: 1.2em; }
.msg.err { color: #e07a5f; }
.msg.ok { color: var(--ok); }
.hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { grid-template-rows: auto auto auto auto; }
  .view canvas { max-height: 60vh; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .bar, .strip, .info { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="bar">
      <div class="brand">Kehys <small>iPad</small></div>
      <button class="btn primary" id="add">Lisää kuvia…</button>
      <button class="btn" id="clear">Tyhjennä</button>
      <input class="hidden-input" type="file" id="file" accept="image/*" multiple>
    </div>
    <div class="view" id="view"><canvas id="pv" width="10" height="10" aria-label="Esikatselu"></canvas><div class="busy" id="busy"></div></div>
    <div>
      <div class="info" id="info"></div>
      <div class="strip" id="strip"></div>
    </div>
  </main>

  <aside class="side">
    <div class="presets">
      <select id="preset" aria-label="Esiasetus"></select>
      <div class="state" id="state"></div>
      <div class="row-btns">
        <button class="btn" id="pSave">Tallenna</button>
        <button class="btn" id="pNew">Tallenna uutena…</button>
        <button class="btn" id="pRevert">Palauta</button>
      </div>
      <div class="inline" id="newRow" hidden>
        <input type="text" id="newName" aria-label="Uuden esiasetuksen nimi">
        <button class="btn primary" id="newOk">Tallenna</button>
        <button class="btn" id="newCancel">Peru</button>
      </div>
      <div class="row-btns">
        <button class="btn" id="pRename">Nimeä…</button>
        <button class="btn" id="pDel">Poista…</button>
        <button class="btn" id="pImport">Tuo…</button>
        <button class="btn" id="pExport">Vie…</button>
        <input class="hidden-input" type="file" id="importFile" accept=".json,application/json">
      </div>
      <div class="inline" id="delRow" hidden>
        <span class="state dirty" style="flex:1">Poistetaanko esiasetus?</span>
        <button class="btn" id="delOk">Poista</button>
        <button class="btn" id="delCancel">Peru</button>
      </div>
    </div>
    <div class="form" id="form"></div>
    <div class="save">
      <div class="row-btns">
        <button class="btn primary" id="saveOne">Tallenna tämä kuva</button>
        <button class="btn" id="saveAll">Tallenna kaikki</button>
      </div>
      <button class="btn primary" id="shareReady" hidden>Jaa / tallenna</button>
      <div class="msg" id="msg"></div>
    </div>
  </aside>
</div>

<script>
/*ENGINE*/
</script>
<script>
/*APP*/
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
